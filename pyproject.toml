[tool.poetry]
name = "industrial-tag-processor"
version = "2.0.0"
description = "Modular event-driven industrial tag processing system"
authors = []
readme = "README.md"
packages = [
    {include = "core"},
    {include = "api"},
    {include = "infra"}
]

[tool.poetry.dependencies]
python = "^3.12"
pyodbc = "^5.2.0"
redis = "^5.0.0"
pydantic = "^2.10.5"
pydantic-settings = "^2.7.1"
structlog = "^24.4.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
prometheus-client = "^0.21.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.2"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
